components_by_slot:
  content:
  - layout_properties: {}
    name: Titre
    properties:
      align: center
      background_color: ''
      bold: true
      font_size: 20
      icon: mi:image_search
      icon_color: theme:Light Green
      icon_size: 50
      italic: true
      line_height: ''
      scale: large
      spacing:
        margin: [null, null, '25', null]
        padding: ['10', null, null, null]
      style: body
      text: A.O.S - Appels d'Offres Survey
      text_color: theme:Primary
      underline: false
    type: form:dep_lin1x4oec0ytd:_Components.Text
  - event_bindings: {click: bt_user_mail_click}
    layout_properties: {}
    name: bt_user_mail
    properties:
      align: center
      background: theme:Background
      bold: true
      border: ''
      enabled: false
      font: ''
      font_size: 12
      foreground: theme:On Primary Container
      icon: fa:user
      icon_align: left
      italic: false
      role: outlined-button
      spacing:
        margin: ['0', null, '20', null]
        padding: ['0', null, '0', null]
      spacing_above: small
      spacing_below: none
      text: Vous n'êtes pas connecté !
      tooltip: ''
      underline: false
      visible: true
    type: Button
  - components: []
    layout_properties: {}
    name: content_panel
    properties: {col_widths: '{}'}
    type: ColumnPanel
  - components:
    - event_bindings: {click: button_se_connecter_click}
      layout_properties: {}
      name: bt_se_connecter
      properties: {align: center, background: 'theme:Olive', bold: false, border: '', enabled: true, font: '', font_size: null, foreground: 'theme:White', icon: '', icon_align: left, italic: false, role: elevated-button, spacing_above: small, spacing_below: small, text: Connection, tooltip: '', underline: false, visible: true}
      type: Button
    - event_bindings: {click: bt_sign_in_click}
      layout_properties: {}
      name: bt_sign_in
      properties: {align: center, background: 'theme:Red', bold: false, border: '', enabled: true, font: '', font_size: null, foreground: 'theme:White', icon: '', icon_align: left, italic: false, role: elevated-button, spacing_above: small, spacing_below: small, text: ' Créez votre compte ', tooltip: '', underline: false, visible: true}
      type: Button
    - event_bindings: {click: bt_deconnect_click}
      layout_properties: {}
      name: bt_deconnect
      properties: {align: center, background: 'theme:Red', bold: false, border: '', enabled: true, font: '', font_size: null, foreground: 'theme:White', icon: '', icon_align: left, italic: false, role: null, spacing_above: small, spacing_below: small, text: Se déconnecter, tooltip: '', underline: false, visible: true}
      type: Button
    layout_properties: {}
    name: flow_panel_connect
    properties: {align: center, gap: medium, vertical_align: middle}
    type: FlowPanel
  - layout_properties: {}
    name: logo
    properties:
      height: '200'
      margin: ['250', null, null, null]
      source: _/theme/Service Web small_transparent.png
    type: Image
  navigation:
  - event_bindings: {click: navigation_link_user_appels_offres_click}
    layout_properties: {}
    name: navigation_link_user_appels_offres
    properties: {badge: false, icon: 'mi:pin', icon_color: 'theme:Light Green', icon_size: '30', navigate_to: null, selected: false, text: Appels d'offres, text_color: 'theme:Light Green', tooltip: '', visible: false}
    type: form:dep_lin1x4oec0ytd:_Components.NavigationLink
  - event_bindings: {}
    layout_properties: {}
    name: navigation_link_user_parametres
    properties: {icon: 'mi:tools_wrench', icon_color: 'theme:Primary', icon_size: '30', navigate_to: Parametres, text: Paramètres, text_color: 'theme:On Primary Container', tooltip: '', visible: false}
    type: form:dep_lin1x4oec0ytd:_Components.NavigationLink
  - event_bindings: {click: navigation_link_user_contact_click}
    layout_properties: {}
    name: navigation_link_user_contact
    properties: {icon: 'mi:contact_mail', icon_color: 'theme:Light Green', icon_size: '30', navigate_to: null, selected: false, text: Contact, text_color: 'theme:Light Green', tooltip: '', visible: false}
