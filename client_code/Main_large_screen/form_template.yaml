  - event_bindings: {}
    layout_properties: {}
    name: navigation_link_admin
    properties: {badge: false, icon: '', icon_color: 'theme:Red', icon_size: '30', navigate_to: Admin, text: Admin, text_color: 'theme:Red', visible: false}
    type: form:dep_lin1x4oec0ytd:_Components.NavigationLink
  - event_bindings: {click: navigation_link_fermer_click}
    layout_properties: {}
    name: navigation_link_fermer
    properties: {icon: 'mi:logout', icon_color: 'theme:Red', icon_size: '30', text: Sortir, text_color: 'theme:Red'}
    type: form:dep_lin1x4oec0ytd:_Components.NavigationLink
is_package: true
layout:
  properties: {navigation_rail_collapse_to: bottom_app_bar, navigation_rail_color: '', navigation_rail_vertical_align: bottom, show_sidesheet: false}
