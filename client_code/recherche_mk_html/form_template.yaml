  properties:
    html: "<div anvil-name=\"zone_desc\"\n    class=\"zone-desc\"\n    style=\"max-height: 400px; overflow: auto; line-height: 1.6; padding: 8px; font-size: 14px; white-space: normal;\">\n</div>\n\n<style>\n    .zone-desc mark.kw-hl {\n        padding: 0 2px;\n        border-radius: 3px;\n        font-weight: 600;\n        color: #111;\n    }\n\n    .zone-desc mark.kw-0 { background: #fff59d; } /* jaune */\n    .zone-desc mark.kw-1 { background: #a5d6a7; } /* vert  */\n    .zone-desc mark.kw-2 { background: #90caf9; } /* bleu  */\n    .zone-desc mark.kw-3 { background: #ffab91; } /* orange */\n    .zone-desc mark.kw-4 { background: #ce93d8; } /* violet */\n    .zone-desc mark.kw-5 { background: #80deea; } /* cyan   */\n</style>\n\n<script>\n    function escapeRegExp(s) {\n        return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    }\n\n    function stripDiacritics(s) {\n        return (s || \"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\");\n    }\n\n    function normalizeKey(s) {\n        return stripDiacritics(s).toLowerCase().trim();\n    }\n\n    function accentInsensitiveChar(ch) {\n        const c = normalizeKey(ch);\n\n        const map = {\n            'a': '[aàáâãäå]',\n            'c': '[cç]',\n            'e': '[eéèêë]',\n            'i': '[iîïíì]',\n            'n': '[nñ]',\n            'o': '[oôöòóõ]',\n            'u': '[uùúûü]',\n            'y': '[yÿý]'\n        };\n\n        return map[c] || escapeRegExp(ch);\n    }\n\n    function accentInsensitivePattern(word) {\n        const base = stripDiacritics(word || \"\");\n        return [...base].map(accentInsensitiveChar).join('');\n    }\n    \n    function getTextNodes(root) {\n        const nodes = [];\n        const walker = document.createTreeWalker(\n            root,\n            NodeFilter.SHOW_TEXT,\n            {\n                acceptNode(node) {\n                    if (!node.nodeValue || !node.nodeValue.trim()) {\n                        return NodeFilter.FILTER_REJECT;\n                    }\n                    const p = node.parentNode;\n                    if (!p) return NodeFilter.FILTER_REJECT;\n\n                    const tag = p.nodeName;\n                    if ([\"SCRIPT\", \"STYLE\", \"MARK\", \"NOSCRIPT\", \"TEXTAREA\"].includes(tag)) {\n                        return NodeFilter.FILTER_REJECT;\n                    }\n                    return NodeFilter.FILTER_ACCEPT;\n                }\n            }\n        );\n\n        let n;\n        while ((n = walker.nextNode())) {\n            nodes.push(n);\n        }\n        return nodes;\n    }\n\n    function render_keywords(html, keywords) {\n        const root = this.find('[anvil-name=\"zone_desc\"]')[0];\n        root.innerHTML = html || \"\";\n\n        let words = (keywords || [])\n            .map(x => (x || \"\").trim())\n            .filter(Boolean);\n\n        if (!words.length) return;\n\n        const seen = new Map();\n        words.forEach(w => {\n            const k = normalizeKey(w);\n            if (!seen.has(k)) seen.set(k, w);\n        });\n        words = Array.from(seen.values());\n\n        words.sort((a, b) => b.length - a.length);\n\n        const colorMap = {};\n        words.forEach((w, i) => {\n            colorMap[normalizeKey(w)] = i % 6;\n        });\n\n        const regexParts = words.map(w => accentInsensitivePattern(w));\n        const regex = new RegExp(\"(\" + regexParts.join(\"|\") + \")\", \"gi\");\n\n        getTextNodes(root).forEach(node => {\n            const text = node.nodeValue;\n            regex.lastIndex = 0;\n\n            if (!regex.test(text)) return;\n\n            regex.lastIndex = 0;\n            const frag = document.createDocumentFragment();\n            let last = 0;\n            let match;\n\n            while ((match = regex.exec(text)) !== null) {\n                const found = match[0];\n                const start = match.index;\n                const end = start + found.length;\n\n                if (start > last) {\n                    frag.appendChild(document.createTextNode(text.slice(last, start)));\n                }\n\n                const mark = document.createElement(\"mark\");\n\n                let idx = 0;\n                for (const w of words) {\n                    const testRe = new RegExp(\"^\" + accentInsensitivePattern(w) + \"$\", \"i\");\n                    if (testRe.test(found)) {\n                        idx = colorMap[normalizeKey(w)] ?? 0;\n                        break;\n                    }\n                }\n\n                mark.className = \"kw-hl kw-\" + idx;\n                mark.textContent = found;\n                frag.appendChild(mark);\n\n                last = end;\n            }\n\n            if (last < text.length) {\n                frag.appendChild(document.createTextNode(text.slice(last)));\n            }\n\n            node.parentNode.replaceChild(frag, node);\n        });\n    }\n</script>"
  type: HtmlTemplate
