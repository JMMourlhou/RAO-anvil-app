components: []
container:
  properties:
    html: |-
      <div anvil-name="zone_desc"
          class="zone-desc"
          style="max-height: 400px; overflow: auto; line-height: 1.6; padding: 8px; font-size: 14px; white-space: pre-wrap;">
      </div>

      <style>
          .zone-desc {
              border: 1px solid #b6c8d6;
              border-left: 5px solid #90caf9;
              border-radius: 10px;
              background: #f4f9ff;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
              color: #1f1f1f;
          }

          .zone-desc mark.kw-hl {
              padding: 0 3px;
              border-radius: 4px;
              font-weight: 600;
              color: #111;
          }

          .zone-desc mark.kw-0 { background: #fff59d; } /* jaune */
          .zone-desc mark.kw-1 { background: #c8e6c9; } /* vert pastel */
          .zone-desc mark.kw-2 { background: #bbdefb; } /* bleu pastel */
          .zone-desc mark.kw-3 { background: #ffe0b2; } /* orange pastel */
          .zone-desc mark.kw-4 { background: #e1bee7; } /* violet pastel */
          .zone-desc mark.kw-5 { background: #b2ebf2; } /* cyan pastel */

          /* =========================================================
          Mots OU trouvés / anciens mots de scoring
          Les mots OU seuls sont rouges.
          Les mots-clés gardent leur fond pastel + texte noir.
          ========================================================= */

          /* Mot OU trouvé seul, qui n'est PAS aussi un mot-clé */
          .zone-desc mark.score-hl:not(.kw-hl) {
              background: transparent !important;
              color: #c62828 !important;
              font-weight: 800 !important;
              font-style: normal !important;
              padding: 0 1px !important;
              border: none !important;
              border-radius: 0 !important;
              text-decoration: none !important;
          }

          /* Mot-clé normal : fond pastel + texte noir gras */
          .zone-desc mark.kw-hl {
              color: #111 !important;
              font-weight: 700 !important;
              font-style: normal !important;
              padding: 0 3px !important;
              border-radius: 4px !important;
          }

          /* Mot qui est à la fois mot-clé ET mot OU trouvé :
          on garde l'apparence mot-clé, pas le rouge */
          .zone-desc mark.kw-hl.score-hl {
              color: #111 !important;
              font-weight: 700 !important;
              font-style: normal !important;
              border: none !important;
              text-decoration: none !important;
          }
      </style>

      <script>
          function escapeRegExp(s) {
              return String(s || "").replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }

          function stripDiacritics(s) {
              return String(s || "")
                  .normalize("NFD")
                  .replace(/[\u0300-\u036f]/g, "");
          }

          function normalizeKey(s) {
              return stripDiacritics(s)
                  .toLowerCase()
                  .trim();
          }

          function accentInsensitiveChar(ch) {
              const c = normalizeKey(ch);

              const map = {
                  'a': '[aàáâãäå]',
                  'c': '[cç]',
                  'e': '[eéèêë]',
                  'i': '[iîïíì]',
                  'n': '[nñ]',
                  'o': '[oôöòóõ]',
                  'u': '[uùúûü]',
                  'y': '[yÿý]'
              };

              return map[c] || escapeRegExp(ch);
          }

          function accentInsensitivePattern(word) {
              const base = stripDiacritics(word || "").trim();
              const pattern = [...base].map(accentInsensitiveChar).join("");
              const norm = normalizeKey(word);

              /*
                  Gestion simple du pluriel :
                  formation -> formations
                  stage -> stages
                  sécurité -> sécurités

                  On évite de l'appliquer aux mots très courts/acronymes :
                  sst, mac, pse1, pse2, etc.
              */
              if (
                  norm.length >= 4 &&
                  !/[sxz0-9]$/.test(norm)
              ) {
                  return pattern + "s?";
              }

              return pattern;
          }

          function isWordChar(ch) {
              return !!ch && /[A-Za-zÀ-ÖØ-öø-ÿ0-9_]/.test(ch);
          }

          function allowPartialMatch(term) {
              /*
                  Règle métier :
                  - mots courts <= 4 caractères : recherche stricte
                    exemple : mac ne doit pas être trouvé dans machine
                    exemple : port ne doit pas être trouvé dans transport

                  - mots longs > 4 caractères : recherche partielle autorisée
                    exemple : ciment doit être trouvé dans fibrociment
                    exemple : rénovation doit être trouvé dans rénovations
              */
              const norm = normalizeKey(term && term.word ? term.word : "");
              return norm.length > 4;
          }

          function getTextNodes(root) {
              const nodes = [];

              const walker = document.createTreeWalker(
                  root,
                  NodeFilter.SHOW_TEXT,
                  {
                      acceptNode(node) {
                          if (!node.nodeValue || !node.nodeValue.trim()) {
                              return NodeFilter.FILTER_REJECT;
                          }

                          const p = node.parentNode;
                          if (!p) {
                              return NodeFilter.FILTER_REJECT;
                          }

                          const tag = p.nodeName;

                          if (["SCRIPT", "STYLE", "MARK", "NOSCRIPT", "TEXTAREA"].includes(tag)) {
                              return NodeFilter.FILTER_REJECT;
                          }

                          return NodeFilter.FILTER_ACCEPT;
                      }
                  }
              );

              let n;

              while ((n = walker.nextNode())) {
                  nodes.push(n);
              }

              return nodes;
          }

          function uniqueCleanList(values) {
              const seen = new Map();

              (values || [])
                  .map(x => String(x || "").trim())
                  .filter(Boolean)
                  .forEach(w => {
                      const k = normalizeKey(w);

                      if (!seen.has(k)) {
                          seen.set(k, w);
                      }
                  });

              return Array.from(seen.values());
          }

          function render_keywords(html, keywords, scoreWords) {
              const foundRoot = this.find('[anvil-name="zone_desc"]');

              if (!foundRoot || !foundRoot.length) {
                  return;
              }

              const root = foundRoot[0];

              root.innerHTML = html || "";

              let kwWords = uniqueCleanList(keywords);
              let scoringWords = uniqueCleanList(scoreWords);

              if (!kwWords.length && !scoringWords.length) {
                  return;
              }

              /*
                  On fusionne les mots-clés et les mots OU trouvés.
                  Un même mot peut donc avoir :
                  - une classe kw-hl + kw-0/kw-1/etc.
                  - une classe score-hl
              */
              const termsMap = new Map();

              kwWords.forEach((w, i) => {
                  const k = normalizeKey(w);

                  termsMap.set(k, {
                      word: w,
                      isKeyword: true,
                      isScore: false,
                      colorIndex: i % 6
                  });
              });

              scoringWords.forEach(w => {
                  const k = normalizeKey(w);

                  if (termsMap.has(k)) {
                      termsMap.get(k).isScore = true;
                  } else {
                      termsMap.set(k, {
                          word: w,
                          isKeyword: false,
                          isScore: true,
                          colorIndex: null
                      });
                  }
              });

              let terms = Array.from(termsMap.values());

              if (!terms.length) {
                  return;
              }

              // Priorité aux expressions les plus longues
              terms.sort((a, b) => b.word.length - a.word.length);

              const regexParts = terms
                  .map(t => accentInsensitivePattern(t.word))
                  .filter(Boolean);

              if (!regexParts.length) {
                  return;
              }

              const regex = new RegExp("(" + regexParts.join("|") + ")", "gi");

              getTextNodes(root).forEach(node => {
                  const text = node.nodeValue;
                  regex.lastIndex = 0;

                  if (!regex.test(text)) {
                      return;
                  }

                  regex.lastIndex = 0;

                  const frag = document.createDocumentFragment();
                  let last = 0;
                  let match;

                  while ((match = regex.exec(text)) !== null) {
                      const found = match[0];
                      const start = match.index;
                      const end = start + found.length;

                      let matchedTerm = null;

                      for (const term of terms) {
                          const testRe = new RegExp(
                              "^" + accentInsensitivePattern(term.word) + "$",
                              "i"
                          );

                          if (testRe.test(found)) {
                              matchedTerm = term;
                              break;
                          }
                      }

                      if (!matchedTerm) {
                          continue;
                      }

                      /*
                          Protection contre les faux positifs :
                          - pour les mots courts, on exige que le mot ne soit pas collé
                            à une lettre, un chiffre ou un underscore.
                          - pour les mots longs, on accepte la recherche partielle.
                      */
                      const before = start > 0 ? text[start - 1] : "";
                      const after = end < text.length ? text[end] : "";

                      if (!allowPartialMatch(matchedTerm)) {
                          if (isWordChar(before) || isWordChar(after)) {
                              continue;
                          }
                      }

                      if (start > last) {
                          frag.appendChild(
                              document.createTextNode(text.slice(last, start))
                          );
                      }

                      const mark = document.createElement("mark");
                      const classes = [];

                      if (matchedTerm.isKeyword) {
                          classes.push("kw-hl");
                          classes.push("kw-" + matchedTerm.colorIndex);
                      }

                      if (matchedTerm.isScore) {
                          classes.push("score-hl");
                      }

                      mark.className = classes.join(" ");
                      mark.textContent = found;

                      frag.appendChild(mark);

                      last = end;
                  }

                  if (last < text.length) {
                      frag.appendChild(
                          document.createTextNode(text.slice(last))
                      );
                  }

                  node.parentNode.replaceChild(frag, node);
              });
          }
      </script>
  type: HtmlTemplate
is_package: true
